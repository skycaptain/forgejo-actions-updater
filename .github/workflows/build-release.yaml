---
name: Build Release

"on":
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (without leading "v")
        required: true
      release_notes:
        description: Release notes in markdown format
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Set release notes
        run: |
          RELEASE_NOTES_FILE=$(mktemp)
          echo "${{ github.event.inputs.release_notes }}" >> "${RELEASE_NOTES_FILE}"
          echo "GORELEASER_RELEASE_NOTES=${RELEASE_NOTES_FILE}" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser versioning=semver
          version: "v2.18.3"
          args: release --clean --release-notes="${{ env.GORELEASER_RELEASE_NOTES }}"
