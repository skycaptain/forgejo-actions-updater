# Skycaptain: Forgejo Actions Updater
#
# SPDX-License-Identifier: BSD-3-Clause
#
[tools]
go = "1.27.4"
pre-commit = "4.7.0"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
"npm:actions-up" = "2.0.0"
python = "3.15.2"

[settings]
lockfile = true

[tasks."dev:check"]
run = 'pre-commit run --all-files --verbose'

[tasks."dev:build"]
run = 'goreleaser build --snapshot --single-target --clean'

[tasks."dev:test"]
run = 'go test -cover -v ./...'
